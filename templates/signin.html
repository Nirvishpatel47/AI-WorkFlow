<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet" href="/static/signin.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Create Account</h1>

            <form id="signupForm">

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p id="message"></p>

            <div class="bottom-text">

                Already have an account?

                <a href="/">
                    Login
                </a>

            </div>

        </div>

    </div>

    <script src="/static/signin.js"></script>

</body>

</html>
