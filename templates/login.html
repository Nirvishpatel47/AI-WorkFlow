<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI — Login</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="card">
        <div class="brand">
            <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </div>
            <span class="brand-name">Smart AI</span>
        </div>

        <h1 class="card-heading">Welcome back</h1>
        <p class="card-subheading">Sign in to your account to continue</p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <p id="message"></p>

        <div class="divider"></div>
        <div class="bottom-text">
            Don't have an account? <a href="/signin">Create one</a>
        </div>
    </div>
</div>
<script src="/static/login.js"></script>
</body>
</html>
